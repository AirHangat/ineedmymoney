function openPass(){form('Ubah kata sandi',[{k:'o',l:'Kata sandi saat ini',t:'password'},{k:'n',l:'Kata sandi baru (min. 8 karakter)',t:'password'},{k:'c',l:'Ulangi kata sandi baru',t:'password'}],async f=>{if(!f.o)return toast('Isi kata sandi saat ini');if((f.n||'').length<8)return toast('Kata sandi baru minimal 8 karakter');if(f.n!==f.c)return toast('Konfirmasi kata sandi tidak sama');const a=await sb.auth.signInWithPassword({email:user.email,password:f.o});if(a.error)return toast('Kata sandi saat ini salah');const{error}=await sb.auth.updateUser({password:f.n});if(error)return toast(error.message);cs();toast('Kata sandi berhasil diubah')},0,1)}
async function start(){if(!user){S={acc:[],tx:[],bud:{},rec:[],debt:[],goal:[],veh:[],svc:[],bill:[],pin:''};WS='';ROLE='owner';$('#au').className='on';render();return}$('#au').className='';$('#app').innerHTML='<p class=em role=status>Memuat data dari database…</p>';try{await load()}catch(e){$('#app').innerHTML='<div class=card role=alert><b>Data belum bisa dimuat</b><small style="display:block;margin:6px 0 12px">'+esc(e.message)+'. Periksa koneksi internet, lalu coba lagi.</small><button type=button class="bt pr" onclick="start()">Coba lagi</button> <button type=button class=bt onclick="logout()">Keluar</button></div>'}}
async function auth(){const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return toast('Isi email dan kata sandi');const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)toast(error.message=='Invalid login credentials'?'Email atau kata sandi salah':error.message)}
const logout=()=>sb.auth.signOut(),swWs=id=>{ls('kk_ws',id);load()};
function teamv(){const ow=ROLE=='owner';return bk('Akun & akses')+`<div class=card><b>${esc(PROF.name||'Nama belum diisi')}</b><small style="display:block;margin:2px 0 8px">${esc(user.email)}${PROF.phone?' · '+esc(PROF.phone):''}<br>Peran: ${RL[ROLE]} · ${esc(WSN)}</small>${WSL.length>1?`<select onchange="swWs(this.value)">${WSL.map(w=>`<option value=${w.id}${w.id==WS?' selected':''}>${esc(w.name)} (${RL[w.role]})</option>`).join('')}</select>`:''}<div class=g2 style="margin-top:8px"><button class=bt onclick="openProf()">Ubah data akun</button><button class=bt onclick="openPass()">Ubah kata sandi</button></div><button class="bt w" onclick="logout()">Keluar</button></div><div class=card><small>Pemilik: semua + kelola anggota<br>Admin: semua data keuangan<br>Editor: mencatat transaksi dan servis kendaraan<br>Pembaca: hanya melihat</small></div>`+(ow?`<button class="bt pr w" onclick="openMem()">+ Tambah anggota</button>`:'')+MEM.map(m=>{const ed=ow&&m.role!='owner',p=PR[m.user_id]||{};return `<div class=it${ed?` onclick="openMem('${m.user_id}')"`:''}><div><b>${esc(p.name||m.email)}</b><small>${p.name?esc(m.email)+' · ':''}${p.phone?esc(p.phone)+' · ':''}${RL[m.role]}${m.user_id==user.id?' · Anda':''}</small></div><span>${ed?'›':''}</span></div>`}).join('')}
function openMem(uid){const m=MEM.find(x=>x.user_id==uid);form(m?'Ubah peran':'Tambah anggota',[{k:'e',l:'Email (akun harus sudah dibuat di Supabase)',v:m?.email},{k:'r',l:'Peran',t:'sel',o:[['admin','Admin: kelola semua data'],['editor','Editor: catat transaksi'],['viewer','Pembaca: hanya lihat']],v:m?.role}],async v=>{const{error}=await sb.rpc('add_member',{ws:WS,em:(v.e||'').trim(),r:v.r});if(error)return toast(/belum terdaftar/.test(error.message)?'Email belum punya akun. Buat dulu di Supabase: Authentication > Users > Add user':error.message);await loadMem();cs();render()},m&&(async()=>{const{error}=await sb.rpc('remove_member',{ws:WS,uid});if(error)return toast(error.message);await loadMem();cs();render()}))}
document.addEventListener('visibilitychange',()=>{if(sb&&user&&WS&&!document.hidden&&!pushing&&!$('#sh').className)load().catch(()=>0)});
if(sb){sb.auth.getSession().then(({data})=>{user=data.session?.user||null;sb.auth.onAuthStateChange((e,s)=>{const u=s?.user||null;if(u?.id!==user?.id){user=u;start()}});start()})}else{applyRec();render();if(S.pin)$('#lk').className='on'}
